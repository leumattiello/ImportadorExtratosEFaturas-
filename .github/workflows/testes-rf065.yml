name: Testes sintéticos Python

on:
  push:
    branches:
      - "feat/rf-065-integracao-etapa-2"
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Executar testes sem rede ou credenciais
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
